[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerogpu-api"
version = "1.0.0"
description = "Official ZeroGPU Python client (responses, chat completions, moderations, embeddings, audio). Published from ZeroGPU API SDKs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "twine>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zerogpu"]
